[project]
name = "ableton-live-rag"
version = "0.5.0"
description = "RAG-система для корпуса документации Ableton: Live, Push, Music Strategies"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.25",
    "llama-index-core>=0.10.0",
    "llama-index-vector-stores-qdrant>=0.2.0",
    "llama-index-embeddings-huggingface>=0.2.0",
    "llama-index-llms-ollama>=0.1.0",
    "llama-index-llms-openai>=0.7.2",
    "llama-index-llms-openai-like>=0.7.1",
    "llama-index-retrievers-bm25>=0.2.0",
    "qdrant-client>=1.12",
    "typer>=0.15",
    "rich>=13.9",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "dvc>=3.67.0",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.3.0",
]

[project.scripts]
rag = "ableton_live_rag.cli:app"

[project.optional-dependencies]
evaluation = [
    "deepeval>=3.9.7",
]
backend = [
    "fastapi>=0.136.1",
    "pydantic>=2.12.5",
    "uvicorn>=0.46.0",
]
bot = [
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "prek>=0.3.8",
    "pytest>=9.0.3",
    "python-semantic-release>=10.5.3",
    "ruff>=0.15.7",
    "ty>=0.0.25",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
commit_message = "chore(release): v{version}"
allow_zero_version = true
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
allowed_tags = ["feat", "fix", "perf", "build", "chore", "ci", "docs", "refactor", "style", "test"]
default_bump_level = 0

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''Initial [Cc]ommit.*''',
]
